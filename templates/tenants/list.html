{% extends 'base.html' %}
{% load static %}
{% block title %}Tenants - Market Rental System{% endblock %}
{% block page_title %}Tenants{% endblock %}

{% block content %}
<div class="space-y-6">
  <!-- Header -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm text-gray-500">Manage all registered tenants</p>
    </div>
    <button type="button"
            hx-get="{% url 'tenant_add_modal' %}"
            hx-target="#modal-content"
            hx-trigger="click"
            onclick="openModal('{% url 'tenant_add_modal' %}')"
            class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition-colors duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      Add Tenant
    </button>
  </div>

  <!-- Filters -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <div class="relative flex-1">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" name="search" placeholder="Search by name, ID or business..."
             hx-get="{% url 'tenant_list' %}"
             hx-target="#tenant-table"
             hx-trigger="keyup changed delay:500ms"
             hx-include="[name='status']"
             value="{{ search_query|default:'' }}"
             class="w-full rounded-lg border border-gray-200 bg-white py-2.5 pl-10 pr-4 text-sm text-gray-700 placeholder-gray-400 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
    </div>
    <select name="status"
            hx-get="{% url 'tenant_list' %}"
            hx-target="#tenant-table"
            hx-trigger="change"
            hx-include="[name='search']"
            class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Status</option>
      <option value="Active" {% if status_filter == 'Active' %}selected{% endif %}>Active</option>
      <option value="Inactive" {% if status_filter == 'Inactive' %}selected{% endif %}>Inactive</option>
      <option value="Suspended" {% if status_filter == 'Suspended' %}selected{% endif %}>Suspended</option>
      <option value="Terminated" {% if status_filter == 'Terminated' %}selected{% endif %}>Terminated</option>
    </select>
  </div>

  <!-- Table -->
  {% include 'tenants/_table.html' %}
</div>
{% endblock %}
