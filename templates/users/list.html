{% extends 'base.html' %}
{% load static %}
{% block title %}Users - Market Rental System{% endblock %}
{% block page_title %}User Management{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-gray-500">Manage system users and their roles</p>
    <a href="{% url 'user_add' %}"
       class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition-colors duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      Add User
    </a>
  </div>

  <!-- Filters -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <div class="relative flex-1">
      <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" name="search" placeholder="Search users..."
             hx-get="{% url 'user_list' %}"
             hx-target="#user-table"
             hx-trigger="keyup changed delay:500ms"
             hx-include="[name='role']"
             value="{{ search_query|default:'' }}"
             class="w-full rounded-lg border border-gray-200 bg-white py-2.5 pl-10 pr-4 text-sm text-gray-700 placeholder-gray-400 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
    </div>
    <select name="role"
            hx-get="{% url 'user_list' %}"
            hx-target="#user-table"
            hx-trigger="change"
            hx-include="[name='search']"
            class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Roles</option>
      <option value="admin" {% if role_filter == 'admin' %}selected{% endif %}>Admin</option>
      <option value="collector" {% if role_filter == 'collector' %}selected{% endif %}>Collector</option>
      <option value="supervisor" {% if role_filter == 'supervisor' %}selected{% endif %}>Supervisor</option>
      <option value="treasurer" {% if role_filter == 'treasurer' %}selected{% endif %}>Treasurer</option>
      <option value="tenant" {% if role_filter == 'tenant' %}selected{% endif %}>Tenant</option>
    </select>
  </div>

  {% include 'users/_table.html' %}
</div>
{% endblock %}
