{% load static %}
{% with status=status %}
<span class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium leading-none
  {% if status == 'Active' or status == 'Paid' or status == 'Occupied' %}
    bg-green-100 text-green-700
  {% elif status == 'Inactive' or status == 'Vacant' or status == 'Cancelled' %}
    bg-gray-100 text-gray-600
  {% elif status == 'Suspended' or status == 'Reserved' or status == 'Partial' %}
    bg-yellow-100 text-yellow-700
  {% elif status == 'Terminated' or status == 'Void' or status == 'Overdue' %}
    bg-red-100 text-red-700
  {% elif status == 'Expired' or status == 'Maintenance' %}
    bg-orange-100 text-orange-700
  {% elif status == 'Pending' %}
    bg-blue-100 text-blue-700
  {% elif status == 'Unpaid' %}
    bg-rose-100 text-rose-700
  {% else %}
    bg-gray-100 text-gray-600
  {% endif %}">
  <span class="inline-block h-1.5 w-1.5 rounded-full
    {% if status == 'Active' or status == 'Paid' or status == 'Occupied' %}
      bg-green-500
    {% elif status == 'Inactive' or status == 'Vacant' or status == 'Cancelled' %}
      bg-gray-400
    {% elif status == 'Suspended' or status == 'Reserved' or status == 'Partial' %}
      bg-yellow-500
    {% elif status == 'Terminated' or status == 'Void' or status == 'Overdue' %}
      bg-red-500
    {% elif status == 'Expired' or status == 'Maintenance' %}
      bg-orange-500
    {% elif status == 'Pending' %}
      bg-blue-500
    {% elif status == 'Unpaid' %}
      bg-rose-500
    {% else %}
      bg-gray-400
    {% endif %}">
  </span>
  {{ status }}
</span>
{% endwith %}
