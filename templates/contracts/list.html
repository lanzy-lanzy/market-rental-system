{% extends 'base.html' %}
{% load static %}
{% block title %}Contracts - Market Rental System{% endblock %}
{% block page_title %}Rental Contracts{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-gray-500">Manage rental contracts between tenants and stall owners</p>
    <button type="button"
            hx-get="{% url 'contract_add_modal' %}"
            hx-target="#modal-content"
            hx-trigger="click"
            onclick="openModal('{% url 'contract_add_modal' %}')"
            class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition-colors duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      New Contract
    </button>
  </div>

  <!-- Filters -->
  <form class="flex flex-wrap gap-3">
    <select name="status"
            hx-get="{% url 'contract_list' %}"
            hx-target="#contract-table"
            hx-trigger="change"
            class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Status</option>
      <option value="Active" {% if status_filter == 'Active' %}selected{% endif %}>Active</option>
      <option value="Expired" {% if status_filter == 'Expired' %}selected{% endif %}>Expired</option>
      <option value="Terminated" {% if status_filter == 'Terminated' %}selected{% endif %}>Terminated</option>
      <option value="Pending" {% if status_filter == 'Pending' %}selected{% endif %}>Pending</option>
    </select>
  </form>

  <!-- Table -->
  {% include 'contracts/_table.html' %}
</div>
{% endblock %}
