{% extends 'base.html' %}
{% load static %}
{% block title %}Stalls - Market Rental System{% endblock %}
{% block page_title %}Stalls{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-gray-500">Manage market stalls and rental spaces</p>
    <button type="button"
            hx-get="{% url 'stall_add_modal' %}"
            hx-target="#modal-content"
            hx-trigger="click"
            onclick="openModal('{% url 'stall_add_modal' %}')"
            class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition-colors duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      Add Stall
    </button>
  </div>

  <!-- Filters -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
    <select name="section"
            hx-get="{% url 'stall_list' %}"
            hx-target="#stall-table"
            hx-trigger="change"
            hx-include="[name='status']"
            class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Sections</option>
      {% for section in sections %}
      <option value="{{ section.id }}" {% if section_filter|stringformat:"s" == section.id|stringformat:"s" %}selected{% endif %}>{{ section.name }}</option>
      {% endfor %}
    </select>
    <select name="status"
            hx-get="{% url 'stall_list' %}"
            hx-target="#stall-table"
            hx-trigger="change"
            hx-include="[name='section']"
            class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Status</option>
      <option value="Vacant" {% if status_filter == 'Vacant' %}selected{% endif %}>Vacant</option>
      <option value="Occupied" {% if status_filter == 'Occupied' %}selected{% endif %}>Occupied</option>
      <option value="Reserved" {% if status_filter == 'Reserved' %}selected{% endif %}>Reserved</option>
      <option value="Maintenance" {% if status_filter == 'Maintenance' %}selected{% endif %}>Maintenance</option>
    </select>
  </div>

  <!-- Table -->
  {% include 'stalls/_table.html' %}
</div>
{% endblock %}
