<div class="panel p-2.5 sm:p-3" data-stalls-workspace-tabs>
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <nav class="flex flex-wrap items-center gap-1.5" aria-label="Stalls workspace" role="tablist">
      <a href="{% url 'stall_list' %}"
         role="tab"
         data-workspace-tab="list"
         {% if stall_nav_tab == 'list' or stall_nav_tab == 'add' %}aria-current="page"{% endif %}
         class="workspace-tab inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition {% if stall_nav_tab == 'list' or stall_nav_tab == 'add' %}is-active bg-[var(--brand-700)] text-white shadow-[var(--shadow-card)]{% else %}text-ink-soft hover:bg-[var(--brand-tint)] hover:text-[var(--brand-700)]{% endif %}">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
        <span>Stalls</span>
      </a>
      <a href="{% url 'market_section_list' %}"
         role="tab"
         data-workspace-tab="sections"
         {% if stall_nav_tab == 'sections' %}aria-current="page"{% endif %}
         class="workspace-tab inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition {% if stall_nav_tab == 'sections' %}is-active bg-[var(--brand-700)] text-white shadow-[var(--shadow-card)]{% else %}text-ink-soft hover:bg-[var(--brand-tint)] hover:text-[var(--brand-700)]{% endif %}">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        <span>Sections</span>
      </a>
      <a href="{% url 'stall_type_list' %}"
         role="tab"
         data-workspace-tab="types"
         {% if stall_nav_tab == 'types' %}aria-current="page"{% endif %}
         class="workspace-tab inline-flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-semibold transition {% if stall_nav_tab == 'types' %}is-active bg-[var(--brand-700)] text-white shadow-[var(--shadow-card)]{% else %}text-ink-soft hover:bg-[var(--brand-tint)] hover:text-[var(--brand-700)]{% endif %}">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        <span>Stall Types</span>
      </a>
    </nav>

    <div class="flex flex-wrap items-center gap-2">
      {% if stall_nav_tab == 'add' %}
      <a href="{% url 'stall_list' %}" class="btn btn-ghost btn-sm">← Back to Stalls</a>
      {% else %}
      <button type="button"
              hx-get="{% url 'stall_add_modal' %}"
              hx-target="#modal-content"
              onclick="openModal('{% url 'stall_add_modal' %}')"
              class="btn btn-primary btn-sm">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Add Stall
      </button>
      {% endif %}
    </div>
  </div>
</div>
