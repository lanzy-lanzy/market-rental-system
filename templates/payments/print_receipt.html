{% load static %}
{% load humanize %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt {{ payment.receipt_number }} - Market Rental System</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}?v={{ STATIC_VERSION }}">
  <style>
    @media print {
      body { background: white; font-size: 11pt; }
      .no-print { display: none !important; }
      @page { margin: 0.5in; }
    }
  </style>
</head>
<body class="bg-white font-sans antialiased text-gray-800">

  <div class="mx-auto max-w-2xl p-6">
    <!-- Action Bar -->
    <div class="no-print mb-6 flex flex-wrap justify-end gap-2">
      <button onclick="window.print()"
              class="inline-flex items-center gap-2 rounded-lg bg-emerald-700 px-4 py-2 text-sm font-semibold text-white">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
        </svg>
        Print Receipt
      </button>
      <a href="{% url 'payment_receipt_export_pdf' payment.id %}" class="inline-flex items-center gap-2 rounded-lg border border-emerald-800 bg-white px-4 py-2 text-sm font-semibold text-emerald-800">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
        Export PDF
      </a>
      {% if back_url %}
      <a href="{{ back_url }}" class="inline-flex items-center gap-2 rounded-lg border border-gray-400 bg-white px-4 py-2 text-sm font-medium text-gray-700">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to list
      </a>
      {% endif %}
      <button onclick="window.close()"
              class="inline-flex items-center gap-2 rounded-lg border border-gray-400 bg-white px-4 py-2 text-sm font-medium text-gray-700">
        Close
      </button>
    </div>

    {% include 'payments/_receipt_body.html' %}
  </div>
{% if auto_print %}
<script>
  // The collect flow arrives with ?auto=1: raise the print dialog once the receipt has rendered.
  window.addEventListener('load', function () { window.print(); });
</script>
{% endif %}

</body>
</html>
