{% extends 'base.html' %}
{% load static %}
{% block title %}Payments - Market Rental System{% endblock %}
{% block page_title %}Payments{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p class="text-sm text-gray-500">Recorded payments and transactions</p>
    <button type="button"
            hx-get="{% url 'payment_add_modal' %}"
            hx-target="#modal-content"
            hx-trigger="click"
            onclick="openModal('{% url 'payment_add_modal' %}')"
            class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary-700 transition-colors duration-200">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
      </svg>
      Record Payment
    </button>
  </div>

  <!-- Filters -->
  <form class="flex flex-wrap gap-3" hx-get="{% url 'payment_list' %}" hx-target="#payment-table" hx-trigger="change">
    <input type="date" name="date_from" value="{{ date_from|default:'' }}"
           class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
    <input type="date" name="date_to" value="{{ date_to|default:'' }}"
           class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
    <select name="status" class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Status</option>
      <option value="Paid" {% if status_filter == 'Paid' %}selected{% endif %}>Paid</option>
      <option value="Partial" {% if status_filter == 'Partial' %}selected{% endif %}>Partial</option>
      <option value="Void" {% if status_filter == 'Void' %}selected{% endif %}>Void</option>
      <option value="Cancelled" {% if status_filter == 'Cancelled' %}selected{% endif %}>Cancelled</option>
    </select>
    <select name="payment_method" class="rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-primary-400 focus:outline-none focus:ring-2 focus:ring-primary-200">
      <option value="">All Methods</option>
      <option value="Cash" {% if payment_method == 'Cash' %}selected{% endif %}>Cash</option>
      <option value="GCash" {% if payment_method == 'GCash' %}selected{% endif %}>GCash</option>
      <option value="Bank Transfer" {% if payment_method == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
      <option value="Check" {% if payment_method == 'Check' %}selected{% endif %}>Check</option>
    </select>
  </form>

  {% include 'payments/_table.html' %}
</div>
{% endblock %}
